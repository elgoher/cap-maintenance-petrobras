name: Deploy — Build & Deploy to BTP Cloud Foundry

# Triggered on every push to main (after PR merge).
# Pipeline: test → build MTA → deploy to CF.

on:
  push:
    branches: [main]

env:
  MTA_NAME: petrobras-maintenance
  NODE_VERSION: '20'

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Stage 1 — Test
  # Same suite as CI, ensures main is always green before deploy.
  # ─────────────────────────────────────────────────────────────────────────────
  test:
    name: Run Test Suite
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run tests
        run: CDS_ENV=test npm test -- --forceExit --no-coverage
        env:
          NODE_ENV: test

  # ─────────────────────────────────────────────────────────────────────────────
  # Stage 2 — Build
  # Compiles CDS models and packages into a deployable .mtar archive.
  # ─────────────────────────────────────────────────────────────────────────────
  build:
    name: Build MTA Archive
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install global tools
        run: |
          npm install -g mbt
          npm install -g @sap/cds-dk

      - name: Install app dependencies
        run: npm ci --ignore-scripts

      - name: Build MTA archive
        run: mbt build --mtar ${{ env.MTA_NAME }}.mtar

      - name: Upload .mtar artifact
        uses: actions/upload-artifact@v4
        with:
          name: mtar
          path: mta_archives/${{ env.MTA_NAME }}.mtar
          retention-days: 3

  # ─────────────────────────────────────────────────────────────────────────────
  # Stage 3 — Deploy
  # Logs in to BTP Cloud Foundry and deploys the .mtar with cf deploy.
  # Required secrets (set in GitHub → Settings → Secrets and variables):
  #   CF_API_URL  : https://api.cf.<region>.hana.ondemand.com
  #   CF_USERNAME : technical user email (S-user or service account)
  #   CF_PASSWORD : technical user password
  #   CF_ORG      : CF organization name
  #   CF_SPACE    : CF space name  (e.g. dev, staging, production)
  # ─────────────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to BTP CF
    runs-on: ubuntu-latest
    needs: build
    environment: production          # enables GitHub manual approval gate

    steps:
      - name: Download .mtar artifact
        uses: actions/download-artifact@v4
        with:
          name: mtar
          path: mta_archives/

      - name: Install CF CLI v8
        run: |
          curl -fsSL \
            "https://packages.cloudfoundry.org/stable?release=linux64-binary&version=v8&source=github" \
            | tar -zx -C /tmp
          sudo mv /tmp/cf8 /usr/local/bin/cf
          cf version

      - name: Install MTA CF plugin
        run: cf install-plugin multiapps -f

      - name: CF Login
        run: |
          cf api "${{ secrets.CF_API_URL }}"
          cf auth "${{ secrets.CF_USERNAME }}" "${{ secrets.CF_PASSWORD }}"
          cf target -o "${{ secrets.CF_ORG }}" -s "${{ secrets.CF_SPACE }}"

      - name: Deploy MTA
        run: |
          cf deploy mta_archives/${{ env.MTA_NAME }}.mtar \
            --strategy rolling \
            --abort-on-error

      - name: Smoke test — verify service responds
        run: |
          APP_ROUTE=$(cf app petrobras-maintenance-srv \
            | grep -E "^routes:" | awk '{print $2}')
          echo "Testing https://${APP_ROUTE}/maintenance/\$metadata"
          curl -sf --max-time 30 \
            "https://${APP_ROUTE}/maintenance/\$metadata" \
            -H "Accept: application/xml" \
            | grep -q "EntityType" \
            && echo "Smoke test passed" \
            || (echo "Smoke test FAILED" && exit 1)

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::Deploy to ${{ secrets.CF_SPACE }} failed. Check CF logs:"
          echo "::error::  cf logs petrobras-maintenance-srv --recent"

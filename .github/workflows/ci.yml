name: CI — Validate Pull Request

# Triggered on every PR targeting main or develop.
# Goal: fast feedback (< 3 min) before merge.

on:
  pull_request:
    branches: [main, develop]

jobs:
  test:
    name: Install & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run test suite
        run: CDS_ENV=test npm test -- --forceExit --no-coverage
        env:
          NODE_ENV: test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: junit.xml
          if-no-files-found: ignore
          retention-days: 7

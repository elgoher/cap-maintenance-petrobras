_schema-version: "3.3.0"
ID: petrobras-maintenance-s2
version: 0.0.1
description: "CAP Workshop Session 2 — Petrobras Maintenance System"

# ─────────────────────────────────────────────────────────────────────────────
# Parameters
# ─────────────────────────────────────────────────────────────────────────────
parameters:
  enable-parallel-deployments: true

# ─────────────────────────────────────────────────────────────────────────────
# Build parameters (global)
# ─────────────────────────────────────────────────────────────────────────────
build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx -p @sap/cds-dk cds build --production

# ─────────────────────────────────────────────────────────────────────────────
# Modules
# ─────────────────────────────────────────────────────────────────────────────
modules:

  # ── 1. CAP Application Server ──────────────────────────────────────────────
  - name: petrobras-maintenance-s2-srv
    type: nodejs
    path: gen/srv
    parameters:
      buildpack: nodejs_buildpack
      disk-quota: 1024M
      memory: 512M
    build-parameters:
      builder: npm-ci
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}
    requires:
      - name: petrobras-maintenance-s2-auth
      - name: petrobras-maintenance-s2-db
      - name: petrobras-maintenance-s2-destination

  # ── 2. HANA HDI Deployer ───────────────────────────────────────────────────
  - name: petrobras-maintenance-s2-db-deployer
    type: hdb
    path: gen/db
    parameters:
      buildpack: nodejs_buildpack
      memory: 256M
      disk-quota: 1024M
    requires:
      - name: petrobras-maintenance-s2-db

  # ── 3. Approuter (optional — enables Fiori Elements preview with XSUAA) ────
  #  Uncomment this module if you want to serve the UI through an approuter
  #  with full XSUAA-based authentication.
  #
  # - name: petrobras-maintenance-s2-approuter
  #   type: approuter.nodejs
  #   path: approuter
  #   parameters:
  #     memory: 256M
  #     disk-quota: 1024M
  #   requires:
  #     - name: petrobras-maintenance-s2-auth
  #       parameters:
  #         config:
  #           xsappname: ~{xsappname}
  #           tenant-mode: dedicated
  #     - name: srv-api
  #       group: destinations
  #       properties:
  #         name: srv-api
  #         url: ~{srv-url}
  #         forwardAuthToken: true

# ─────────────────────────────────────────────────────────────────────────────
# Resources (BTP service instances)
# ─────────────────────────────────────────────────────────────────────────────
resources:

  # ── XSUAA ──────────────────────────────────────────────────────────────────
  - name: petrobras-maintenance-s2-auth
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
      config:
        xsappname: petrobras-maintenance-s2-${org}-${space}
        tenant-mode: dedicated

  # ── SAP HANA Cloud (HDI Container) ─────────────────────────────────────────
  - name: petrobras-maintenance-s2-db
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared
    properties:
      hdi-service-name: ${service-name}

  # ── Destination Service ────────────────────────────────────────────────────
  - name: petrobras-maintenance-s2-destination
    type: org.cloudfoundry.managed-service
    parameters:
      service: destination
      service-plan: lite
      config:
        init_data:
          instance:
            existing_destinations_policy: update
            destinations:
              # Replace the URL, client-id, client-secret, and token URL below
              # with the actual values for your SparePartsAPI system.
              - Name: SparePartsAPI
                Description: Spare Parts Catalog API (OAuth2)
                Type: HTTP
                URL: https://your-spare-parts-api.example.com
                Authentication: OAuth2ClientCredentials
                clientId: YOUR_CLIENT_ID
                clientSecret: YOUR_CLIENT_SECRET
                tokenServiceURL: https://your-uaa.authentication.us10.hana.ondemand.com/oauth/token
                tokenServiceURLType: Dedicated
                HTML5.DynamicDestination: true
                ProxyType: Internet
